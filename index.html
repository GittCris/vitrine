<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casa & Estilo Móveis — Vitrine</title>
  <meta name="description" content="Confira nossos móveis e peça pelo WhatsApp." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <div class="container topo__in">
      <a class="logo" href="#" id="logo">Casa &amp; Estilo</a>
      <a class="btn btn--wpp btn--sm" id="btn-topo" target="_blank" rel="noopener">Falar no WhatsApp</a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1 id="hero-titulo">Móveis que transformam sua casa</h1>
      <p>Escolha seu móvel e fale direto com a gente pelo WhatsApp.</p>
      <a class="btn btn--wpp" href="#vitrine">Ver produtos</a>
    </div>
  </section>

  <main class="container" id="vitrine">
    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar móvel..." aria-label="Buscar móvel" />
      <div class="chips" id="chips" role="tablist"></div>
    </div>
    <div class="grade" id="grade"></div>
    <p class="vazio" id="vazio" hidden>Nenhum produto encontrado. Chame a gente no WhatsApp, talvez tenhamos o que você procura!</p>
  </main>

  <footer class="rodape">
    <div class="container">
      <strong id="rod-nome"></strong>
      <span id="rod-end"></span>
      <span id="rod-hor"></span>
      <a id="rod-insta" target="_blank" rel="noopener" hidden>Instagram</a>
    </div>
  </footer>

  <a class="flutuante" id="btn-flutuante" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 32 32" width="30" height="30" fill="#fff" aria-hidden="true"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.4.7 4.7 1.9 6.6L3 29l7.100-1.800a12.600 12.600 0 0 0 5.900 1.500c6.900 0 12.600-5.600 12.600-12.500S22.900 3 16 3zm0 22.900c-1.900 0-3.800-.5-5.400-1.500l-.4-.2-4.200 1.100 1.100-4.100-.3-.4a10.300 10.300 0 0 1-1.600-5.500C5.200 9.800 10 5.200 16 5.200s10.800 4.600 10.800 10.300S22 25.900 16 25.900zm5.900-7.700c-.3-.2-1.900-.9-2.200-1s-.5-.2-.7.200-.8 1-1 1.200-.4.200-.7.100a8.500 8.500 0 0 1-4.200-3.700c-.3-.6.300-.5.900-1.700.1-.2 0-.4 0-.5l-1-2.300c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400s-1 1-1 2.500 1.100 2.900 1.200 3.100 2.100 3.300 5.200 4.500c1.900.8 2.700.9 3.600.7.600-.1 1.900-.8 2.100-1.500s.3-1.400.2-1.500-.3-.2-.6-.4z"/></svg>
  </a>

  <script src="script.js"></script>
</body>
</html>
